<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bitcoin Crazy Pong</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      touch-action: none;
      font-family: monospace;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      background: #222;
    }
    
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      background: #222;
    }
    
    canvas {
      border: 1px solid #fff;
      background: #000;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #flash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #F7931A; /* Bitcoin orange */
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.05s linear;
    }

    #modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.9);
      border: 2px solid #F7931A;
      padding: 30px;
      color: white;
      text-align: center;
      min-width: 320px;
      max-width: 90%;
      z-index: 1000;
    }

    #modal .title {
      font-size: 48px;
      margin-bottom: 5px;
      color: #F7931A;
    }

    #modal .subtitle {
      font-size: 24px;
      margin-bottom: 20px;
      color: #F7931A;
    }

    #modal p {
      margin: 20px 0;
      line-height: 1.5;
    }

    #modal button {
      background: #F7931A;
      color: black;
      border: none;
      padding: 10px 20px;
      margin-top: 15px;
      font-family: monospace;
      cursor: pointer;
    }

    #modal button:active {
      background: #d17c15;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="flash"></div>
  <div id="modal">
    <div class="title">₿</div>
    <div class="subtitle">CRAZY PONG</div>
    <p>This is the bitcoin crazy pong, is harder when the difficulty is higher, use it with up and down buttons on desktop or slide it on mobile</p>
    <button onclick="startGame()">Got it!</button>
  </div>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const flash = document.getElementById('flash');

    // Bitcoin difficulty variables
    let bitcoinDifficulty = 0;
    let normalizedDifficulty = 0;
    let gameStarted = false;

    // Fetch Bitcoin difficulty
    async function fetchBitcoinDifficulty() {
      try {
        const response = await fetch('https://mempool.space/api/v1/mining/hashrate/1m');
        const data = await response.json();
        bitcoinDifficulty = data.currentDifficulty;
        // Normalize difficulty to 0-100 range using log scale
        // Focus on the last digits by using modulo and log scale
        const lastDigits = bitcoinDifficulty % 1e14; // Get last 14 digits
        const logDiff = Math.log10(lastDigits + 1); // Add 1 to avoid log(0)
        // Scale from 0 to 100 range, focusing on the last digits
        normalizedDifficulty = Math.min(100, Math.max(0, Math.floor(logDiff * 15)));
        console.log('Bitcoin Difficulty:', bitcoinDifficulty, 'Last Digits:', lastDigits, 'Normalized:', normalizedDifficulty);
      } catch (error) {
        console.error('Error fetching Bitcoin difficulty:', error);
        // Fallback to random difficulty if API fails
        normalizedDifficulty = Math.floor(Math.random() * 101);
      }
    }

    // Flash effect function
    function flashScreen() {
      flash.style.opacity = 1;
      setTimeout(() => {
        flash.style.opacity = 0;
      }, 50);
    }

    // Set canvas size based on screen size
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    
    // Initial resize and add event listener
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('orientationchange', () => {
      setTimeout(resizeCanvas, 100);
    });

    // Ball and paddles
    let ball = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: Math.min(canvas.width, canvas.height) * 0.02,
      speedX: 4,
      speedY: 3,
      maxSpeed: 8,
      minSpeed: 3,
      friction: 0.999
    };

    let leftPaddle = {
      x: canvas.width * 0.05,
      y: canvas.height / 2 - canvas.height * 0.15,
      width: canvas.width * 0.02,
      height: canvas.height * 0.3,
      speed: 5
    };

    let rightPaddle = {
      x: canvas.width * 0.95 - canvas.width * 0.02,
      y: canvas.height / 2 - canvas.height * 0.15,
      width: canvas.width * 0.02,
      height: canvas.height * 0.3,
      speed: 5
    };

    // Score tracking
    let leftScore = 0;
    let rightScore = 0;

    // Touch controls
    let touchStartY = 0;
    let touchMoveY = 0;
    let isTouching = false;
    let rightPaddleSpeed = 0; // Track paddle's vertical speed

    canvas.addEventListener('touchstart', (e) => {
      if (!gameStarted) return;
      e.preventDefault();
      isTouching = true;
      touchStartY = e.touches[0].clientY;
    });

    canvas.addEventListener('touchmove', (e) => {
      if (!gameStarted) return;
      e.preventDefault();
      if (isTouching) {
        touchMoveY = e.touches[0].clientY;
        const deltaY = touchMoveY - touchStartY;
        const oldY = rightPaddle.y;
        rightPaddle.y += deltaY;
        rightPaddleSpeed = (rightPaddle.y - oldY) * 0.5; // Calculate paddle speed
        touchStartY = touchMoveY;
      }
    });

    canvas.addEventListener('touchend', (e) => {
      if (!gameStarted) return;
      e.preventDefault();
      isTouching = false;
      rightPaddleSpeed = 0; // Reset paddle speed
    });

    // Keyboard controls
    let keys = {
      ArrowUp: false,
      ArrowDown: false
    };

    document.addEventListener('keydown', (e) => {
      if (!gameStarted) return;
      keys[e.key] = true;
    });
    document.addEventListener('keyup', (e) => {
      if (!gameStarted) return;
      keys[e.key] = false;
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        rightPaddleSpeed = 0; // Reset paddle speed when key is released
      }
    });

    // Game loop
    function gameLoop() {
      if (!gameStarted) return;
      
      // Clear canvas
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Bitcoin watermark
      ctx.font = '180px monospace';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.03)'; // Very faint white
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('₿', canvas.width / 2, canvas.height / 2);
      
      // Draw "CRAZY PONG" text
      ctx.font = '20px monospace';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.1)'; // Slightly more visible than the Bitcoin symbol
      ctx.fillText('CRAZY PONG', canvas.width / 2, canvas.height / 2 + 100);
      
      // Reset text alignment and baseline for other text
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = '#fff';

      // Move paddles
      // Left paddle moves automatically with increased error
      let targetY = ball.y - leftPaddle.height / 2;
      // Adjust error based on Bitcoin difficulty
      let errorRange = 80 - (normalizedDifficulty * 0.6); // Error range from 80 to 20
      let error = Math.random() * errorRange - (errorRange / 2);
      // Add random delay to AI reaction based on difficulty
      if (Math.random() < (0.3 - (normalizedDifficulty * 0.002))) { // Delay chance from 30% to 10%
        targetY = leftPaddle.y; // Stay in current position
      }
      targetY += error;
      let moveSpeed = (targetY - leftPaddle.y) * (0.05 + (normalizedDifficulty * 0.0005)); // Speed from 0.05 to 0.1
      leftPaddle.y += moveSpeed;
      
      // Right paddle controlled by touch or keyboard
      const oldY = rightPaddle.y;
      if (keys['ArrowUp']) rightPaddle.y -= rightPaddle.speed;
      if (keys['ArrowDown']) rightPaddle.y += rightPaddle.speed;
      // Calculate paddle speed for keyboard controls
      if (keys['ArrowUp'] || keys['ArrowDown']) {
        rightPaddleSpeed = (rightPaddle.y - oldY) * 0.5;
      }

      // Keep paddles inside canvas
      rightPaddle.y = Math.max(0, Math.min(canvas.height - rightPaddle.height, rightPaddle.y));
      leftPaddle.y = Math.max(0, Math.min(canvas.height - leftPaddle.height, leftPaddle.y));

      // Apply friction to ball
      ball.speedX *= ball.friction;
      ball.speedY *= ball.friction;

      // Ensure minimum speed
      if (Math.abs(ball.speedX) < ball.minSpeed) {
        ball.speedX = ball.minSpeed * Math.sign(ball.speedX);
      }
      if (Math.abs(ball.speedY) < ball.minSpeed) {
        ball.speedY = ball.minSpeed * Math.sign(ball.speedY);
      }

      // Move ball
      ball.x += ball.speedX;
      ball.y += ball.speedY;

      // Ball collision with top/bottom
      if (ball.y - ball.radius < 0) {
        ball.y = ball.radius;
        ball.speedY = Math.abs(ball.speedY);
      } else if (ball.y + ball.radius > canvas.height) {
        ball.y = canvas.height - ball.radius;
        ball.speedY = -Math.abs(ball.speedY);
      }

      // Ball collision with paddles
      if (
        ball.x - ball.radius < leftPaddle.x + leftPaddle.width &&
        ball.x + ball.radius > leftPaddle.x &&
        ball.y > leftPaddle.y &&
        ball.y < leftPaddle.y + leftPaddle.height
      ) {
        // Calculate where on the paddle the ball hit (-1 at top, 1 at bottom)
        let hitPosition = (ball.y - leftPaddle.y - leftPaddle.height / 2) / (leftPaddle.height / 2);
        // Reverse direction and adjust vertical speed based on hit position
        ball.x = leftPaddle.x + leftPaddle.width + ball.radius; // Prevent ball from getting stuck
        ball.speedX = Math.abs(ball.speedX) * 1.05; // Smaller speed increase
        ball.speedY = hitPosition * ball.maxSpeed + moveSpeed * 0.8; // Add AI paddle momentum
      } else if (
        ball.x + ball.radius > rightPaddle.x &&
        ball.x - ball.radius < rightPaddle.x + rightPaddle.width &&
        ball.y > rightPaddle.y &&
        ball.y < rightPaddle.y + rightPaddle.height
      ) {
        // Calculate where on the paddle the ball hit (-1 at top, 1 at bottom)
        let hitPosition = (ball.y - rightPaddle.y - rightPaddle.height / 2) / (rightPaddle.height / 2);
        // Reverse direction and adjust vertical speed based on hit position
        ball.x = rightPaddle.x - ball.radius; // Prevent ball from getting stuck
        ball.speedX = -Math.abs(ball.speedX) * 1.05; // Smaller speed increase
        ball.speedY = hitPosition * ball.maxSpeed + rightPaddleSpeed * 0.8; // Add player paddle momentum
      }

      // Ball out of bounds - score and reset
      if (ball.x < 0) {
        rightScore++;
        flashScreen();
        resetBall();
      } else if (ball.x > canvas.width) {
        leftScore++;
        flashScreen();
        resetBall();
      }

      // Draw paddles and ball
      ctx.fillStyle = '#fff';
      ctx.fillRect(leftPaddle.x, leftPaddle.y, leftPaddle.width, leftPaddle.height);
      ctx.fillRect(rightPaddle.x, rightPaddle.y, rightPaddle.width, rightPaddle.height);
      
      // Calculate ball size based on speed
      const baseRadius = ball.radius;
      const speed = Math.sqrt(ball.speedX * ball.speedX + ball.speedY * ball.speedY);
      const minRadius = baseRadius * 0.6; // Ball won't get smaller than 60% of original size
      const speedFactor = Math.min(1, 8 / speed); // Inverse relationship with speed
      const dynamicRadius = minRadius + (baseRadius - minRadius) * speedFactor;
      
      // Draw ball in Bitcoin orange
      ctx.fillStyle = '#F7931A';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, dynamicRadius, 0, Math.PI * 2);
      ctx.fill();
      
      // Reset fill style for text
      ctx.fillStyle = '#fff';

      // Draw scores
      ctx.font = '14px monospace';
      ctx.fillText(`Satoshi: ${leftScore}`, 20, 30);
      ctx.textAlign = 'right';
      ctx.fillText(`${rightScore}: You`, canvas.width - 20, 30);
      ctx.textAlign = 'left';

      // Draw difficulty with Bitcoin symbol
      ctx.font = '10px monospace';
      ctx.textAlign = 'center';
      const difficultyStr = bitcoinDifficulty.toFixed(6).replace(/\.?0+$/, '');
      ctx.fillText(`₿ difficulty: ${difficultyStr}`, canvas.width / 2, canvas.height - 10);
      ctx.textAlign = 'left'; // Reset text alignment

      requestAnimationFrame(gameLoop);
    }

    // Reset ball position
    function resetBall() {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      ball.speedX = -ball.speedX;
      ball.speedY = Math.random() * 6 - 3; // Random vertical speed
    }

    // Start game function
    function startGame() {
      document.getElementById('modal').style.display = 'none';
      gameStarted = true;
      fetchBitcoinDifficulty();
      setInterval(fetchBitcoinDifficulty, 5 * 60 * 1000);
      gameLoop();
    }
  </script>
</body>
</html>
