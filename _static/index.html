<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bitcoin Crazy Pong</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      touch-action: none;
      font-family: monospace;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      background: #222;
    }
    
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      background: #222;
    }
    
    canvas {
      border: 1px solid #fff;
      background: #000;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #flash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #F7931A; /* Bitcoin orange */
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.05s linear;
    }

    #modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.9);
      border: 2px solid #F7931A;
      padding: 30px;
      color: white;
      text-align: center;
      min-width: 320px;
      max-width: 90%;
      z-index: 1000;
    }

    #modal .title {
      font-size: 48px;
      margin-bottom: 5px;
      color: #F7931A;
    }

    #modal .subtitle {
      font-size: 24px;
      margin-bottom: 20px;
      color: #F7931A;
    }

    #modal p {
      margin: 20px 0;
      line-height: 1.5;
    }

    #modal button {
      background: #F7931A;
      color: black;
      border: none;
      padding: 10px 20px;
      margin-top: 15px;
      font-family: monospace;
      cursor: pointer;
    }

    #modal button:active {
      background: #d17c15;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="flash"></div>
  <div id="modal">
    <div class="title">₿</div>
    <div class="subtitle">CRAZY PONG</div>
    <p>This is the bitcoin crazy pong! The difficulty changes every 5 seconds based on the Bitcoin mempool size. When the mempool is full, Satoshi becomes more unpredictable! Use up/down arrows on desktop or slide on mobile to control your paddle.</p>
    <button onclick="startGame()">Got it!</button>
  </div>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const flash = document.getElementById('flash');

    // Bitcoin difficulty variables
    let bitcoinDifficulty = 0;
    let normalizedDifficulty = 0;
    let gameStarted = false;

    // Fetch Bitcoin mempool data
    async function fetchBitcoinMempool() {
      try {
        const response = await fetch('https://mempool.space/api/mempool');
        const data = await response.json();
        
        // Store the transaction count
        bitcoinDifficulty = data.count;
        
        // Map transaction count to difficulty (0-100)
        // Typical mempool size ranges from 1000 to 50000 transactions
        // We'll use 25000 as the midpoint
        const minTx = 1000;
        const maxTx = 50000;
        const midTx = 25000;
        
        if (data.count <= midTx) {
          // Below midpoint: map 1000-25000 to 0-50
          normalizedDifficulty = Math.min(50, Math.max(0, ((data.count - minTx) / (midTx - minTx)) * 50));
        } else {
          // Above midpoint: map 25000-50000 to 50-100
          normalizedDifficulty = Math.min(100, 50 + ((data.count - midTx) / (maxTx - midTx)) * 50);
        }
        
        console.log('Mempool Size:', data.count, 'transactions');
        console.log('Normalized Difficulty:', normalizedDifficulty);
      } catch (error) {
        console.error('Error fetching mempool data:', error);
        // Fallback to random difficulty if API fails
        normalizedDifficulty = Math.floor(Math.random() * 101);
      }
    }

    // Initial fetch
    fetchBitcoinMempool();
    // Update every 5 seconds
    setInterval(fetchBitcoinMempool, 5 * 1000);

    // Flash effect function
    function flashScreen() {
      flash.style.opacity = 1;
      setTimeout(() => {
        flash.style.opacity = 0;
      }, 50);
    }

    // Set canvas size based on screen size
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    
    // Initial resize and add event listener
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('orientationchange', () => {
      setTimeout(resizeCanvas, 100);
    });

    // Ball and paddles
    let ball = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: Math.min(canvas.width, canvas.height) * 0.02,
      speedX: 4,
      speedY: 3,
      maxSpeed: 8,
      minSpeed: 3,
      friction: 0.999
    };

    let leftPaddle = {
      x: canvas.width * 0.05,
      y: canvas.height / 2 - canvas.height * 0.15,
      width: canvas.width * 0.02,
      height: canvas.height * 0.3,
      speed: 5
    };

    let rightPaddle = {
      x: canvas.width * 0.95 - canvas.width * 0.02,
      y: canvas.height / 2 - canvas.height * 0.15,
      width: canvas.width * 0.02,
      height: canvas.height * 0.3,
      speed: 5
    };

    // Score tracking
    let leftScore = 0;
    let rightScore = 0;

    // Touch controls
    let touchStartY = 0;
    let touchMoveY = 0;
    let isTouching = false;
    let leftPaddleSpeed = 0;
    let paddleMomentum = 0;
    const momentumDecay = 0.95; // How quickly momentum decays
    const maxMomentum = 15; // Maximum momentum speed

    canvas.addEventListener('touchstart', (e) => {
      if (!gameStarted) return;
      e.preventDefault();
      isTouching = true;
      touchStartY = e.touches[0].clientY;
      paddleMomentum = 0; // Reset momentum on new touch
    });

    canvas.addEventListener('touchmove', (e) => {
      if (!gameStarted) return;
      e.preventDefault();
      if (isTouching) {
        touchMoveY = e.touches[0].clientY;
        const deltaY = touchMoveY - touchStartY;
        const oldY = leftPaddle.y;
        leftPaddle.y += deltaY;
        leftPaddleSpeed = (leftPaddle.y - oldY) * 0.5;
        // Store the last movement speed for momentum
        paddleMomentum = Math.min(Math.max(deltaY * 0.8, -maxMomentum), maxMomentum);
        touchStartY = touchMoveY;
      }
    });

    canvas.addEventListener('touchend', (e) => {
      if (!gameStarted) return;
      e.preventDefault();
      isTouching = false;
      leftPaddleSpeed = 0;
      // Momentum is already set from the last movement
    });

    // Keyboard controls
    let keys = {
      ArrowUp: false,
      ArrowDown: false
    };

    document.addEventListener('keydown', (e) => {
      if (!gameStarted) return;
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        paddleMomentum = 0; // Reset momentum when key is pressed
      }
      keys[e.key] = true;
    });

    document.addEventListener('keyup', (e) => {
      if (!gameStarted) return;
      keys[e.key] = false;
      if (e.key === 'ArrowUp') {
        paddleMomentum = -maxMomentum * 0.5; // Add upward momentum on release
      } else if (e.key === 'ArrowDown') {
        paddleMomentum = maxMomentum * 0.5; // Add downward momentum on release
      }
      leftPaddleSpeed = 0;
    });

    // Game loop
    function gameLoop() {
      if (!gameStarted) return;
      
      // Clear canvas
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Bitcoin watermark
      ctx.font = '180px monospace';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.03)'; // Very faint white
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('₿', canvas.width / 2, canvas.height / 2);
      
      // Draw "CRAZY PONG" text
      ctx.font = '20px monospace';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.1)'; // Slightly more visible than the Bitcoin symbol
      ctx.fillText('CRAZY PONG', canvas.width / 2, canvas.height / 2 + 100);
      
      // Reset text alignment and baseline for other text
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = '#fff';

      // Move paddles
      // Right paddle (AI) moves automatically with increased error
      let targetY = ball.y - rightPaddle.height / 2;
      // Adjust error based on Bitcoin difficulty
      let errorRange = 80 - (normalizedDifficulty * 0.6);
      let error = Math.random() * errorRange - (errorRange / 2);
      if (Math.random() < (0.3 - (normalizedDifficulty * 0.002))) {
        targetY = rightPaddle.y;
      }
      targetY += error;
      let moveSpeed = (targetY - rightPaddle.y) * (0.05 + (normalizedDifficulty * 0.0005));
      rightPaddle.y += moveSpeed;
      
      // Left paddle controlled by touch/keyboard + momentum
      const oldY = leftPaddle.y;
      if (keys['ArrowUp']) {
        leftPaddle.y -= leftPaddle.speed;
        paddleMomentum = 0; // Reset momentum during key press
      }
      if (keys['ArrowDown']) {
        leftPaddle.y += leftPaddle.speed;
        paddleMomentum = 0; // Reset momentum during key press
      }
      
      // Apply momentum if not touching and not pressing keys
      if (!isTouching && !keys['ArrowUp'] && !keys['ArrowDown'] && paddleMomentum !== 0) {
        leftPaddle.y += paddleMomentum;
        paddleMomentum *= momentumDecay; // Decay the momentum
        // Stop very small momentum to prevent endless tiny movements
        if (Math.abs(paddleMomentum) < 0.1) paddleMomentum = 0;
      }

      // Calculate paddle speed for collision physics
      if (keys['ArrowUp'] || keys['ArrowDown']) {
        leftPaddleSpeed = (leftPaddle.y - oldY) * 0.5;
      } else {
        leftPaddleSpeed = paddleMomentum * 0.5;
      }

      // Keep paddles inside canvas and stop momentum if hitting edges
      if (leftPaddle.y < 0) {
        leftPaddle.y = 0;
        paddleMomentum = 0;
      } else if (leftPaddle.y > canvas.height - leftPaddle.height) {
        leftPaddle.y = canvas.height - leftPaddle.height;
        paddleMomentum = 0;
      }

      // Apply friction to ball
      ball.speedX *= ball.friction;
      ball.speedY *= ball.friction;

      // Ensure minimum speed
      if (Math.abs(ball.speedX) < ball.minSpeed) {
        ball.speedX = ball.minSpeed * Math.sign(ball.speedX);
      }
      if (Math.abs(ball.speedY) < ball.minSpeed) {
        ball.speedY = ball.minSpeed * Math.sign(ball.speedY);
      }

      // Move ball
      ball.x += ball.speedX;
      ball.y += ball.speedY;

      // Ball collision with top/bottom
      if (ball.y - ball.radius < 0) {
        ball.y = ball.radius;
        ball.speedY = Math.abs(ball.speedY);
      } else if (ball.y + ball.radius > canvas.height) {
        ball.y = canvas.height - ball.radius;
        ball.speedY = -Math.abs(ball.speedY);
      }

      // Ball collision with paddles
      if (
        ball.x - ball.radius < leftPaddle.x + leftPaddle.width &&
        ball.x + ball.radius > leftPaddle.x &&
        ball.y > leftPaddle.y &&
        ball.y < leftPaddle.y + leftPaddle.height
      ) {
        // Calculate where on the paddle the ball hit (-1 at top, 1 at bottom)
        let hitPosition = (ball.y - leftPaddle.y - leftPaddle.height / 2) / (leftPaddle.height / 2);
        // Reverse direction and adjust vertical speed based on hit position
        ball.x = leftPaddle.x + leftPaddle.width + ball.radius; // Prevent ball from getting stuck
        ball.speedX = Math.abs(ball.speedX) * 1.05; // Smaller speed increase
        ball.speedY = hitPosition * ball.maxSpeed + leftPaddleSpeed * 0.8; // Add player paddle momentum
      } else if (
        ball.x + ball.radius > rightPaddle.x &&
        ball.x - ball.radius < rightPaddle.x + rightPaddle.width &&
        ball.y > rightPaddle.y &&
        ball.y < rightPaddle.y + rightPaddle.height
      ) {
        // Calculate where on the paddle the ball hit (-1 at top, 1 at bottom)
        let hitPosition = (ball.y - rightPaddle.y - rightPaddle.height / 2) / (rightPaddle.height / 2);
        // Reverse direction and adjust vertical speed based on hit position
        ball.x = rightPaddle.x - ball.radius; // Prevent ball from getting stuck
        ball.speedX = -Math.abs(ball.speedX) * 1.05; // Smaller speed increase
        ball.speedY = hitPosition * ball.maxSpeed + moveSpeed * 0.8; // Add AI paddle momentum
      }

      // Ball out of bounds - score and reset
      if (ball.x < 0) {
        rightScore++;
        flashScreen();
        resetBall();
      } else if (ball.x > canvas.width) {
        leftScore++;
        flashScreen();
        resetBall();
      }

      // Draw paddles and ball
      ctx.fillStyle = '#fff';
      ctx.fillRect(leftPaddle.x, leftPaddle.y, leftPaddle.width, leftPaddle.height);
      ctx.fillRect(rightPaddle.x, rightPaddle.y, rightPaddle.width, rightPaddle.height);
      
      // Calculate ball size based on speed
      const baseRadius = ball.radius;
      const speed = Math.sqrt(ball.speedX * ball.speedX + ball.speedY * ball.speedY);
      const minRadius = baseRadius * 0.6; // Ball won't get smaller than 60% of original size
      const speedFactor = Math.min(1, 8 / speed); // Inverse relationship with speed
      const dynamicRadius = minRadius + (baseRadius - minRadius) * speedFactor;
      
      // Draw ball in Bitcoin orange
      ctx.fillStyle = '#F7931A';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, dynamicRadius, 0, Math.PI * 2);
      ctx.fill();
      
      // Reset fill style for text
      ctx.fillStyle = '#fff';

      // Draw scores
      // Left score (You)
      ctx.textAlign = 'left';
      ctx.font = '32px monospace'; // Bigger font for score
      ctx.fillText(leftScore, 40, 50);
      ctx.font = '14px monospace'; // Smaller font for name
      ctx.fillText('You', 40, 70);

      // Right score (Satoshi)
      ctx.textAlign = 'right';
      ctx.font = '32px monospace'; // Bigger font for score
      ctx.fillText(rightScore, canvas.width - 40, 50);
      ctx.font = '14px monospace'; // Smaller font for name
      ctx.fillText('Satoshi', canvas.width - 40, 70);
      
      ctx.textAlign = 'left'; // Reset alignment

      // Draw difficulty with Bitcoin symbol
      ctx.font = '10px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(`₿ mempool: ${bitcoinDifficulty} tx`, canvas.width / 2, canvas.height - 10);
      ctx.textAlign = 'left'; // Reset text alignment

      requestAnimationFrame(gameLoop);
    }

    // Reset ball position
    function resetBall() {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      ball.speedX = -ball.speedX;
      ball.speedY = Math.random() * 6 - 3; // Random vertical speed
    }

    // Start game function
    function startGame() {
      document.getElementById('modal').style.display = 'none';
      gameStarted = true;
      gameLoop();
    }
  </script>
</body>
</html>
